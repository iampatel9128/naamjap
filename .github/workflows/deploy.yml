name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx expo export --platform web

      - name: Add PWA files and 404 fallback
        run: |
          cp public/manifest.json dist/manifest.json
          cp public/sw.js dist/sw.js
          # Inject PWA tags into the generated index.html
          sed -i 's|</head>|    <link rel="manifest" href="/naamjap/manifest.json" />\n    <meta name="theme-color" content="#FF6B00" />\n    <meta name="apple-mobile-web-app-capable" content="yes" />\n    <meta name="apple-mobile-web-app-status-bar-style" content="default" />\n    <meta name="apple-mobile-web-app-title" content="Naam Jap" />\n  </head>|' dist/index.html
          sed -i 's|</body>|    <script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/naamjap/sw.js")})}</script>\n  </body>|' dist/index.html
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
